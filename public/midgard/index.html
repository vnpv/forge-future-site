<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.__LESSONS__=[{"id": "lesson1", "teacher": "Вчитель А", "subject": "Українська мова", "grade": "8", "date": "20.01.2026", "format": "Змішаний: клас + онлайн-учні, презентація через трансляцію", "topic": "Відокремлені додатки", "recorded": "≈17 хв змістовного запису з 38", "context": "На 16-й хвилині зникло світло, і далі запис порожній. Аналіз охоплює лише початок уроку: актуалізацію, мотивацію й лінгвістичне спостереження. Етапи після 16:40 позначено як «поза записом», а не як відсутні.", "summary": "Сильний вхід у нову тему. Вчителька систематизує вже вивчене («чотири види ускладнення, три ми знаємо, сьогодні четвертий»), подає поняття через візуальні метафори («щось одне виділяється з-поміж однакових») і через лінгвістичне спостереження підводить учнів до самостійного висновку. Коли зникло світло, урок не зупинився: вчителька перейшла на диктування. Резерв: актуалізація забрала ≈6 хвилин усного переказу визначень, тож її можна зробити більш практичною.", "stages": [{"from": "00:00", "to": "01:10", "name": "Організаційний момент", "note": "перевірка трансляції для онлайн-учнів"}, {"from": "01:10", "to": "03:30", "name": "Емоційне налаштування", "note": "слайд «Скільки в тебе енергії?»"}, {"from": "03:30", "to": "09:15", "name": "Актуалізація знань", "note": "синтаксис, пунктуація, 3 вивчені види ускладнення"}, {"from": "09:15", "to": "10:10", "name": "Тема уроку", "note": "«Відокремлені додатки», запис"}, {"from": "10:10", "to": "11:50", "name": "Мотивація через метафори", "note": "картинки «одне особливе серед однакових»"}, {"from": "11:50", "to": "14:20", "name": "Лінгвістичне спостереження", "note": "«крім правди», «особливо літо» → висновок"}, {"from": "14:20", "to": "16:40", "name": "Запис прикладів", "note": "блекаут → диктування"}, {"from": "16:40", "to": "38:00", "name": "Поза записом", "note": "відсутнє світло, аудіо порожнє", "gap": true}], "strengths": [{"id": "s1", "title": "Метафорична подача поняття", "text": "До правила учні отримують візуальні метафори (собаки, кішки, «один особливий») і відчувають суть відокремлення: виділити щось одне з-поміж решти. Учні самі підхоплюють метафору.", "ev": [["11:01", "Якщо ви зрозумієте і відчуєте всі картини, які я вибрала, ви зрозумієте тему"], ["11:30", "Коли ми когось або щось… виділяємо. Ось це найточніша метафора"]]}, {"id": "s2", "title": "Системна актуалізація", "text": "Нова тема вбудована в карту розділу: чотири види ускладнення речення, три вже вивчено, сьогодні четвертий. Учні бачать, де вони в курсі.", "ev": [["05:30", "Всього в нас є 4 види ускладнення. Із них ми скільки вивчили? Три. Сьогодні будемо над цим працювати"]]}, {"id": "s3", "title": "Лінгвістичне спостереження", "text": "Правило не диктується готовим: учні порівнюють пари речень і самі називають різницю (уточнення, виключення, включення).", "ev": [["12:25", "Чим різняться ось ці речення від ось тих? Хто помітив?"], ["13:48", "Який висновок ми можемо зробити із цього лінгвістичного спостереження?"]]}, {"id": "s4", "title": "Гнучкість у форс-мажорі", "text": "Коли зникло світло, вчителька спокійно переходить на диктування, і урок продовжується.", "ev": [["15:58", "Нічого, будемо без світла. Я продиктую, друзі"]]}], "recommendations": [{"id": "r1", "title": "Практичніша актуалізація", "text": "≈6 хвилин пішло на усне пригадування визначень. Замість цього можна дати 3–4 речення на слайді й попросити знайти й назвати ускладнення. Перевірка та сама, але учні працюють з мовою, а не з формулюваннями.", "ev": [["03:35", "Хто нагадає мені, що таке синтаксис?"], ["06:53", "Друзі, що таке вставні слова, нагадайте мені"]]}, {"id": "r2", "title": "«Не знаю» передавати класу", "text": "Коли учень відповідає «не знаю», вчителька дає визначення сама. Краще передати питання іншому учню або дати підказку й повернутися до першого: так «не знаю» не стає безпечним виходом.", "ev": [["06:00", "Звертання — це що таке? — Нічого. Не знаю"]]}, {"id": "r3", "title": "План Б для змішаного формату", "text": "В умовах блекаутів варто мати ключові слайди в зошитах або роздруківках і короткий план уроку без проєктора. Вчителька зреагувала добре, але онлайн-учні після 16:40 фактично лишилися без уроку.", "ev": [["16:03", "Якщо не видно, я продиктую"]]}], "notRecommended": "", "blocks": [{"name": "Мета", "items": [{"id": "m1", "c": "чіткість / зрозумілість / відповідність", "lv": "strong", "t": "Тему чітко названо, записано й прив'язано до системи розділу.", "ev": [["09:17", "Хочу, щоб ви записали тему. Відокремлені додатки"]]}, {"id": "m2", "c": "досяжність", "lv": "na", "t": "Досягнення мети оцінити не можна: закріплення й підсумок поза записом.", "ev": []}]}, {"name": "Структура та логіка уроку", "items": [{"id": "st1", "c": "базові елементи структури", "lv": "strong", "t": "У записаній частині є організаційний момент, емоційне налаштування, актуалізація, тема, мотивація й вивчення нового. Закріплення, підсумок і рефлексія поза записом.", "ev": [["01:11", "Хочу, щоб ви подивилися на цей слайд і подумали: а ви яка енергія?"]]}, {"id": "st2", "c": "логічна послідовність етапів", "lv": "strong", "t": "Порядок такий: що вже знаємо → чого бракує → метафора → спостереження → висновок → запис.", "ev": [["09:10", "І нам залишилося з вами розібратися з відокремленими"]]}, {"id": "st3", "c": "чітке визначення часу для етапів", "lv": "partial", "t": "До нової теми перейшли на 10-й хвилині, актуалізація триває ≈6 хв. Для 38-хвилинного уроку це забагато.", "ev": [["03:32", "Ми продовжуємо вивчати з вами синтаксис та пунктуацію"]]}, {"id": "st4", "c": "гнучкість, реакція на несподівані ситуації", "lv": "strong", "t": "Учениця сама помітила метафору, і вчителька підхопила це. Привітання з днем народження вбудоване природно. Блекаут перекрито диктуванням.", "ev": [["09:26", "Це, до речі, цікава метафора. Дякую, що ти помітила"], ["15:58", "Нічого, будемо без світла"]]}]}, {"name": "Зміст", "items": [{"id": "z1", "c": "доступність та ясність подачі", "lv": "strong", "t": "Абстрактне поняття пояснено через метафору й живий приклад «люблю всі пори року, особливо літо».", "ev": [["12:50", "От я всі пори року люблю, але особливо літо… я виділяю серед решти саме літо"]]}, {"id": "z2", "c": "відповідність віковим особливостям", "lv": "strong", "t": "Метафори з енергією та тваринами, теплий тон. Відповідає 8 класу.", "ev": [["01:20", "Чи, можливо, ви працюєте на резерві, чи ви атомна електростанція?"]]}, {"id": "z3", "c": "пов'язування з набутими знаннями", "lv": "strong", "t": "Звертання, вставні слова й однорідні члени повторено як опору для нового виду ускладнення.", "ev": [["04:47", "Які види ускладнення ми з вами вже розглянули?"]]}, {"id": "z4", "c": "актуальність для життя учнів", "lv": "partial", "t": "Приклади життєві, але навіщо відокремлення в реальному мовленні (точність, акцент), прямо не сказано.", "ev": []}, {"id": "z5", "c": "інтеграція з іншими дисциплінами", "lv": "partial", "t": "Є приклад з художньої літератури (В. Шевчук) на слайді. Інших міжпредметних зв'язків у записі немає.", "ev": []}]}, {"name": "Комунікація", "items": [{"id": "k1", "c": "діалог, а не монолог", "lv": "strong", "t": "Майже кожен крок іде через запитання до класу. Вчителька чекає на відповіді, а не відповідає сама.", "ev": [["12:30", "Чим саме? Хто помітив? Хто уважний у нас?"]]}, {"id": "k2", "c": "контакт через емоцію", "lv": "strong", "t": "Вчителька ділиться власним станом («мені теж бракує світла, енергії») і тепло реагує на відповіді.", "ev": [["01:11", "І мені теж, знаєте, інколи бракує світла, бракує енергії"], ["01:51", "Ой, чудова метафора, клас, дякую"]]}, {"id": "k3", "c": "професійна етика", "lv": "strong", "t": "Зауваження короткі й без оцінки особистості.", "ev": [["07:58", "Телефон — це наш помічник, ми його використовуємо за призначенням"]]}, {"id": "k4", "c": "позитивна атмосфера в класі", "lv": "strong", "t": "Доброзичливий тон, привітання з днем народження, підтримка відповідей.", "ev": [["15:01", "Бажаємо тобі гарних друзів, позитивних емоцій, побільше світла в житті"]]}, {"id": "k5", "c": "контроль за дотриманням правил школи", "lv": "strong", "t": "Є зауваження щодо телефона і щодо роботи на уроці.", "ev": [["07:51", "Зауваження тобі"]]}, {"id": "k6", "c": "врахування емоційного стану учнів", "lv": "strong", "t": "Слайд енергії з 8 станами, вчителька вислуховує кожного, хто хоче поділитися.", "ev": [["03:22", "Можливо, ті, хто зараз генерує понад норму, поділиться"]]}]}, {"name": "Залучення учнів", "items": [{"id": "u1", "c": "залучення всіх учнів до роботи", "lv": "strong", "t": "Вчителька звертається поіменно до багатьох учнів, зокрема онлайн, і прямо запрошує пасивних.", "ev": [["05:12", "[учні], чекаю вашої теж активності"], ["00:51", "Скажи, будь ласка, чи видно тобі презентацію?"]]}, {"id": "u2", "c": "індивідуальні та групові форми роботи", "lv": "partial", "t": "У записаній частині лише фронтальна робота й індивідуальні відповіді.", "ev": []}, {"id": "u3", "c": "різноманітність методів", "lv": "strong", "t": "Метафоричні образи, лінгвістичне спостереження (пошуковий метод), евристична бесіда.", "ev": [["11:49", "А якщо подивитися вже на конкретні приклади…"]]}, {"id": "u4", "c": "адаптація методів до рівня учнів", "lv": "strong", "t": "Підказки на дошці для тих, хто забув, і перехід від образу до правила.", "ev": [["03:42", "А підказки на дошці є для тих, хто забувся"]]}, {"id": "u5", "c": "диференційований підхід", "lv": "none", "t": "У записаній частині не спостерігався.", "ev": []}]}, {"name": "Інструменти та ресурси", "items": [{"id": "i1", "c": "наочні матеріали", "lv": "strong", "t": "Презентація Canva (26 слайдів): слайд енергії, таблиця «Ускладнене речення», метафоричні зображення, слайд лінгвістичного спостереження.", "ev": [["04:37", "Подивіться, будь ласка, зараз на дошку"]]}, {"id": "i2", "c": "інтерактивні платформи", "lv": "none", "t": "У записаній частині не використовувались.", "ev": []}, {"id": "i3", "c": "доцільність використання інструментів", "lv": "strong", "t": "Кожен слайд працює на ідею уроку, зокрема картинки-метафори.", "ev": []}]}, {"name": "Оцінювання", "items": [{"id": "o1", "c": "формувальне оцінювання", "lv": "partial", "t": "Усний зворотний зв'язок є, але переважно похвала («чудово», «супер»). Конкретики, що саме вдалося, бракує.", "ev": [["09:03", "Так, вони повторюють… вони відповідають на одне і те саме питання"]]}, {"id": "o2", "c": "бали / відсотки", "lv": "na", "t": "Поза записом.", "ev": []}, {"id": "o3", "c": "самооцінювання / взаємооцінювання", "lv": "na", "t": "Поза записом.", "ev": []}]}, {"name": "Підсумок", "items": [{"id": "p1", "c": "запитання для перевірки розуміння", "lv": "strong", "t": "Учні узагальнюють спостереження й формулюють, що таке відокремлений додаток.", "ev": [["13:57", "Хто зможе зараз узагальнити, що ж це — відокремлені додатки?"]]}, {"id": "p2", "c": "рефлексія", "lv": "na", "t": "Психологічне налаштування було на початку. Змістова рефлексія поза записом.", "ev": []}, {"id": "p3", "c": "завдання на закріплення / самостійну роботу", "lv": "na", "t": "За рішенням методиста цей пункт не оцінюємо. До того ж він поза записом.", "ev": []}]}], "limits": "Звук із трансляції. З 16:40 запис порожній (блекаут), тож друга половина уроку не аналізувалась. Імена учнів у звіті приховано.", "teacherId": "t1", "isoDate": "2026-01-20", "lessonMin": 45, "recordedMin": 17, "review": {"status": "approved", "note": "Прийнято без правок (рішення 02.10.2026)"}}, {"id": "lesson2", "teacher": "Вчитель Б", "subject": "Всесвітня історія", "grade": "не вказано у записі", "date": "26.01.2026", "format": "Офлайн у класі + трансляція для онлайн-учнів", "topic": "Суспільство Середньовіччя. Феодальна система", "recorded": "38 хв", "context": "Перший урок спареної пари. Підсумок, зміна виду діяльності й домашнє завдання можуть бути на другому уроці, тому за їх відсутність бал не знижуємо.", "summary": "Урок побудований на діалозі. Вчителька майже не подає матеріал монологом: учні самі доходять до висновків, бо вона ставить запитання на осмислення («чому королю було важливо…», «чи може одна людина управляти країною?») і разом із ними аналізує мініатюру XII ст. Межі поведінки тримає послідовно й коректно, через цінності школи, і атмосфера при цьому лишається живою. Найбільший резерв: коротка робота в парах або групах і мета уроку, сформульована як результат для учнів.", "stages": [{"from": "00:00", "to": "03:17", "name": "Організаційний момент", "note": "здача телефонів, місця, зауваження"}, {"from": "03:17", "to": "07:27", "name": "Емоційне налаштування", "note": "колесо емоцій (feelingswheel.app)"}, {"from": "07:27", "to": "09:00", "name": "Тема уроку", "note": "«Суспільство Середньовіччя», запис у зошит"}, {"from": "09:00", "to": "16:18", "name": "Аналіз мініатюри XII ст.", "note": "три стани: ті, що працюють, воюють, моляться"}, {"from": "16:18", "to": "23:00", "name": "Влада монарха і Папи", "note": "чому король — «втілення Бога»"}, {"from": "23:00", "to": "28:00", "name": "Земля як джерело багатства", "note": "розподіл земель: герцоги → барони → лицарі"}, {"from": "28:00", "to": "31:00", "name": "Як стати лицарем", "note": "питання учня + «потримати інтригу»"}, {"from": "31:00", "to": "36:20", "name": "Сеньйор і васал", "note": "поняття, перевірка розуміння"}, {"from": "36:20", "to": "38:00", "name": "Кінець запису", "note": "перерва між уроками пари"}], "strengths": [{"id": "s1", "title": "Якісні запитання", "text": "Запитання вимагають критично осмислити вивчене або спертися на власний досвід учнів: чому король видавав себе за втілення Бога, чи може одна людина управляти державою, навіщо роздавати землю.", "ev": [["17:27", "Чому королю було важливо пропагувати ідею того, що він є втіленням Бога на землі?"], ["23:34", "Чи може одна людина управляти країною?"], ["34:34", "Для чого комусь роздавати землю?"]]}, {"id": "s2", "title": "Робота з ілюстрацією як із джерелом", "text": "Мініатюру XII ст. учні аналізують самі: спершу висловлюють свої здогадки («чувак в обладунках», «жрець»), а в діалозі доходять до трьох станів. Вчителька веде, але висновок не підказує.", "ev": [["09:00", "У нас є чудове зображення 12 століття, яке уособлює три суспільні стани"], ["13:20", "Якби ви були дослідниками середньовіччя, ви б одразу здогадалися…"]]}, {"id": "s3", "title": "Діалогічність і гнучкість", "text": "Учнівські запитання (про жебраків, про те, чи може селянин стати лицарем) вплітаються в урок. Вчителька каже «дуже доречне питання» і цим заохочує учнів думати вголос.", "ev": [["29:16", "Чи мені потримати інтригу?"], ["34:26", "Дуже доречне питання."]]}, {"id": "s4", "title": "Ціннісний орієнтир і емоційний інтелект", "text": "Зауваження завжди прив'язані до цінностей школи і подані без приниження. Вчителька відкрито говорить про власні почуття через «я-повідомлення».", "ev": [["04:13", "Коли ти перебиваєш іншу людину, яку цінність школи це порушує?"], ["15:44", "Я відчуваю себе приниженою насправді. Бо я вам розповідаю, готую доволі цікавий урок"]]}], "recommendations": [{"id": "r1", "title": "Коротка робота в парах", "text": "Після пояснення «сеньйор / васал» дати 3–4 хвилини в парах: побудувати драбину для вигаданого королівства й підписати, хто кому сеньйор. Активність перейде від 5–6 найактивніших учнів до всіх. Якщо на другому уроці пари це вже заплановано, рекомендація знімається.", "ev": [["33:17", "Барон хто? Сеньйор чи васал?"]]}, {"id": "r2", "title": "Мета як результат для учнів", "text": "Тему оголошено, а мету у форматі «наприкінці пари ви зможете пояснити…» ні. Одне речення на старті дає учням критерій і місток до підсумку на другому уроці.", "ev": [["07:27", "Сьогодні ми з вами розпочинаємо нову тему"]]}, {"id": "r3", "title": "Пауза на обдумування перед відповіддю", "text": "Відповіді часто вигукують одночасно кілька учнів. Прийом «30 секунд подумай мовчки, потім рука» дає шанс тихим учням і зменшує вигуки без жорсткіших правил.", "ev": [["34:26", "Наступний раз попрошу тебе не викрикувати, а все ж таки дочекатися"]]}], "notRecommended": "Не рекомендуємо посилювати межі чи дисципліну: вчителька вже чітко тримає рамки побутових питань і поведінки, а жива атмосфера на уроці є цінністю.", "blocks": [{"name": "Мета", "items": [{"id": "m1", "c": "чіткість / зрозумілість / відповідність", "lv": "partial", "t": "Тему оголошено й записано, вона відповідає змісту уроку. Мету як очікуваний результат для учнів не проговорено.", "ev": [["07:27", "Сьогодні ми з вами розпочинаємо нову тему… Суспільство середньовіччя. Записуємо"]]}, {"id": "m2", "c": "досяжність", "lv": "strong", "t": "Обсяг реалістичний для першої половини пари: три стани, ієрархія, поняття «сеньйор» і «васал» записані та відпрацьовані.", "ev": [["31:14", "Запишемо. Сеньйор. Це людина, що володіє землею"]]}]}, {"name": "Структура та логіка уроку", "items": [{"id": "st1", "c": "базові елементи структури", "lv": "strong", "t": "Є організаційний момент, емоційне налаштування, тема, мотивація через джерело, новий матеріал і закріплення в діалозі. Підсумок і рефлексія за змістом, ймовірно, на другому уроці пари.", "ev": [["00:16", "У нас ще всі здали своїм телефони"], ["03:17", "Звернемо увагу на ось те колесо емоцій"]]}, {"id": "st2", "c": "логічна послідовність етапів", "lv": "strong", "t": "Матеріал іде від загального до конкретного: три стани → хто на вершині → звідки багатство (земля) → як її розподіляли → сеньйор і васал.", "ev": [["22:22", "Яке основне джерело грошей у середньовіччі?"]]}, {"id": "st3", "c": "чітке визначення часу для етапів", "lv": "partial", "t": "До нової теми перейшли на 7-й хвилині: організаційний момент і колесо емоцій забрали чверть запису. Побутові питання вчителька обмежує чітко («для цього є перерва»), тож час втрачається не через них, а через довге налаштування.", "ev": [["07:27", "Сьогодні ми з вами розпочинаємо нову тему"], ["26:07", "Для того, щоб вирішити свої справи, є перерва"]]}, {"id": "st4", "c": "гнучкість, реакція на несподівані запитання", "lv": "strong", "t": "Вчителька підхоплює запитання учнів (про жебраків, чи може селянин стати лицарем) і пропонує класу проголосувати, чи «потримати інтригу».", "ev": [["12:06", "Але найчастіше вони жили при церкві, тому ми можемо цілком віднести їх до тих, що моляться"], ["29:16", "Чи мені потримати інтригу?"]]}]}, {"name": "Зміст", "items": [{"id": "z1", "c": "доступність та ясність подачі", "lv": "strong", "t": "Складні ідеї пояснено на конкретних сценах: засуха й король, який перекладає відповідальність на Бога; розподіл Франції між герцогами.", "ev": [["19:31", "Наприклад, якщо засуха і селяни йдуть до короля… А король каже: ну ви грішили"]]}, {"id": "z2", "c": "відповідність віковим особливостям", "lv": "strong", "t": "Мова близька до учнів, з гумором; учнівський сленг вчителька м'яко перекладає на терміни («чувак в обладунках» → воїн, лицар).", "ev": [["26:13", "Найміть собі тайм-менеджера"]]}, {"id": "z3", "c": "пов'язування з набутими знаннями", "lv": "strong", "t": "Учні самі згадують Стародавній Єгипет (фараон як втілення бога), вчителька спирається на це. Нагадує раніше вивчене про роль Папи Римського.", "ev": [["16:47", "Ми були в Єгипті, і кожен їхній цар… втілення Бога"], ["21:00", "Я нагадую вам, що Папа Римський — це той, хто наділяв короля владою"]]}, {"id": "z4", "c": "актуальність для життя учнів", "lv": "partial", "t": "Питання про легітимність влади й делегування («чи може одна людина управляти країною?») мають сучасний вимір, але явного містка до сьогодення не зроблено.", "ev": [["16:31", "Прем'єр-міністра ще не було"]]}, {"id": "z5", "c": "інтеграція з іншими дисциплінами", "lv": "partial", "t": "Є зв'язки з історією Стародавнього світу, візуальним мистецтвом (мініатюра) та емоційним навчанням, але епізодичні.", "ev": [["0       b.items.map(it => el('div', {class:'crit'}, el('div', {class:'row'}, el('b', {}, it.c), el('span', {class:'lv lv-' + it.lv}, EXCLUDED.has(it.id) ? 'не оцінюється' : LVN[it.lv])), el('p', {}, it.t), evList(it.ev)))));
  });
  V.append(det);
  if (L.limits) V.append(el('p', {class:'note', style:'margin-top:12px'}, 'Обмеження: ' + L.limits));
}

// ===== Методика =====
function methodology() {
  return el('div', {class:'panel', style:'margin-top:14px'}, el('div', {class:'ph'}, el('h2', {}, 'Як рахуються оцінки')),
    el('div', {class:'method'},
      el('div', {}, el('h3', {}, 'Індекс уроку, 0–100'), el('ol', {},
        el('li', {}, 'Кожен критерій бланку: виражено = 2, частково = 1, не спостерігалось = 0.'),
        el('li', {}, '«Поза записом» не знижує бал: критерій просто не враховується. Домашнє завдання не оцінюється.'),
        el('li', {}, 'Блок = набрані бали / максимум × 100.'),
        el('li', {}, 'Індекс уроку = зважене середнє блоків:')),
        el('div', {class:'wt'}, BLOCKS.flatMap(B => [el('span', {}, B.name), el('b', {}, B.w + '%')]))),
      el('div', {}, el('h3', {}, 'Рівні'), el('ul', {}, BANDS.map(([lo, n, k], i) => el('li', {}, el('span', {class:'pill band-' + k}, n), ' ', i ? `${lo}–${BANDS[i - 1][0] - 1}` : `${lo}–100`))),
        el('h3', {style:'margin-top:12px'}, 'Достовірність запису'), el('p', {style:'margin:6px 0 0'}, 'Частка критеріїв, які вдалося оцінити, × частка уроку, що потрапила в запис. Висока ≥ 75%, середня ≥ 50%, низька < 50%. Урок з низькою достовірністю показано, але у профіль вчителя і школи він входить з меншою вагою.')),
      el('div', {}, el('h3', {}, 'Індекс вчителя'), el('p', {style:'margin:6px 0 0'}, 'Середнє індексів його уроків, зважене на достовірність. Надійність вибірки: 1–2 уроки — попередня оцінка, 3–5 — формується, 6+ — стабільна.'),
        el('h3', {style:'margin-top:12px'}, 'Індекс школи'), el('p', {style:'margin:6px 0 0'}, 'Те саме середнє по всіх уроках у вибраному періоді, предметі чи вчителеві.'))));
}

function render() {
  renderFilters();
  if (route === 'teacher') teacher(routeId); else if (route === 'lesson') lesson(routeId); else home();
}

// ===== Дані =====
(function initRoute() { try { const h = location.hash.slice(1); if (h.startsWith('t-')) { route = 'teacher'; routeId = h.slice(2); } else if (h.startsWith('l-')) { route = 'lesson'; routeId = h.slice(2); } } catch (e) {} })();
(async () => {
  // Публічна версія (forge-future.com/midgard): дані вшиті в сторінку, без авторизації
  if (window.__LESSONS__) { ALL = window.__LESSONS__.map(L => ({...L, S: scoreLesson(L)})); render(); return; }
  let db = null;
  try { db = await claude.use('db'); } catch (e) {}
  if (!db) { document.getElementById('view').replaceChildren(el('div', {class:'panel empty', style:'margin-top:18px'}, el('h2', {}, 'Дані недоступні в цьому перегляді'), el('p', {}, 'Відкрийте дашборд, увійшовши в акаунт, якому надано доступ.'))); return; }
  db.collection('lessons').onSnapshot(snap => {
    ALL = snap.docs.map(d => { const L = d.data(); return {...L, id: L.id || d.id, S: scoreLesson(L)}; }).filter(L => L.isoDate && L.blocks);
    render();
  }, () => document.getElementById('view').replaceChildren(el('div', {class:'panel empty', style:'margin-top:18px'}, el('h2', {}, 'Не вдалося завантажити уроки'), el('p', {}, 'Оновіть сторінку.'))));
})();
</script>
