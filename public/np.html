<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>NotePlan</title>
<style>body{font:16px system-ui,sans-serif;padding:2rem;max-width:32rem}a{color:#06c}</style></head>
<body><p id="m">Відкриваю NotePlan…</p><p><a id="l" href="#">Якщо не відкрилось, натисни тут</a></p>
<script>
(function(){
  var q=new URLSearchParams(location.search),d=q.get('d')||'',s=q.get('s')||'',e=q.get('e')||'';
  if(!/^\d{8}$/.test(d)){document.getElementById('m').textContent='Невірна дата';return}
  var u='noteplan://x-callback-url/openNote?noteDate='+d;
  if(/^\d+$/.test(s)&&/^\d+$/.test(e))u+='&highlightStart='+s+'&highlightEnd='+e;
  document.getElementById('l').href=u;
  location.href=u;
  setTimeout(function(){document.getElementById('m').textContent='Якщо NotePlan не відкрився, натисни посилання нижче'},1500);
})();
</script></body></html>
